<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine Proposal</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 100%;
      position: relative;
    }

    h1 {
      margin-bottom: 30px;
    }

    button {
      font-size: 18px;
      padding: 10px 25px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
    }

    #no {
      background-color: #adb5bd;
      color: white;
    }

    .note {
      margin-top: 25px;
      font-size: 12px;
      color: #555;
    }

    .heart {
      position: absolute;
      font-size: 24px;
      animation: float 1s ease-out forwards;
      pointer-events: none;
    }

    @keyframes float {
      0% {opacity: 1; transform: translateY(0) scale(1);}
      100% {opacity: 0; transform: translateY(-150px) scale(2);}
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my Valentine, Javeria? 💖</h1>

    <button id="yes">Yes 💕</button>
    <button id="no">No 😶</button>

    <div class="note">
      * I'll bully you if you say No 😡
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");

    // Make NO button move away when hovered
    noBtn.addEventListener("mouseenter", () => {
      const card = document.querySelector(".card");
      const cardRect = card.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = cardRect.width - btnRect.width;
      const maxY = cardRect.height - btnRect.height;

      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;

      noBtn.style.position = "absolute";
      noBtn.style.left = randomX + "px";
      noBtn.style.top = randomY + "px";
    });

    // YES button click: floating hearts
    yesBtn.addEventListener("click", (e) => {
      for(let i=0; i<15; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerText = "💖";
        heart.style.left = e.clientX + Math.random()*50 - 25 + "px";
        heart.style.top = e.clientY + Math.random()*50 - 25 + "px";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 1000);
      }
    });
  </script>
</body>
</html>
